<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="324pt" height="208.8pt" viewBox="0 0 324 208.8" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <desc>Two panels sharing a vertical axis, the share who never hear, from 0 to 1. Left, spontaneous stopping (SIR), with catching the idea read as hearing it, the share who never hear against the basic reproduction number R0 from 0 to 5. It is 1 up to R0 = 1, where a dashed vertical line marks the threshold, and then falls, to about 0.42 at R0 = 1.5, 0.11 at 2.5 and 0.007 at 5. Right, contact-triggered stopping (rumor model): three dots, for spreaders who stop after k = 1, 2 and 3 meetings with people who already know, at 0.203, 0.060 and 0.020. The rumor model has no rate to set and is not placed on the R0 axis.</desc>
