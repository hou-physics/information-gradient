<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="324pt" height="216pt" viewBox="0 0 324 216" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <desc>Three bars of the mean monthly return of McLean and Pontiff's 97 long-short portfolios, in percent: in the original samples, after the samples ended but before publication, and after publication, each labeled with the average number of months of its period. A whisker on each bar spans one standard deviation of the predictors' mean returns on each side of the mean, the spread of the estimated means, which includes each mean's sampling error; the whiskers of the two later bars reach below zero. Open diamonds on the two later bars mark the in-sample mean plus the paper's regression coefficients, this book's calculation. The vertical axis runs from −0.4 to 1.2 percent a month, with a thin line at zero.</desc>
