 <desc>一格，两个坐标轴都取对数，纵轴是度平均场里 SIS 的传播阈值，从 0.0001 到 1，横轴是网络规模，从 100 到 10 亿，共 22 个规模。每人 6 条连线的网络是一条水平线，在每个规模上都是 1/6 = 0.167。两条下降的线是每人至少 3 条连线的幂律，指数 3 的那条在规模 100 时约 0.145，100 万时约 0.0557，10 亿时约 0.0375；指数 2.5 的那条在 100 时约 0.0783，100 万时约 0.00363，10 亿时约 0.000363。在图中的每个规模上，两条线都在零以上。</desc>
