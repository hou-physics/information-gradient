  <desc>一张图，横轴是时间，以 1/(α + β) 为单位，从 0 到 8；纵轴从 0 到 1，两条曲线共用。听说过这条消息的人所占的比例是一条 S 曲线，从 0 开始，先慢慢上升，在时间 2.54 前后升得最快，那里有一条竖直的虚线，标出新听说的人最多，I = 0.46，之后在 1 附近趋平。新药合约的价格从先验概率 0.30 开始，升向报告说成功之后的信念 0.632，这个信念画成一条水平的虚线；价格也在同一时间升得最快。结算在时刻 8，价格 0.630 沿虚线跳到 1 或 0，新药有效时跳到 1，概率 0.632，无效时跳到 0，概率 0.368。图下的说明写着，比值 β/α = 12.7 是 Sultan、Farley 与 Lehmann 两个平均系数之比，只用来给出形状，先验概率 0.30，报告有 80% 的时候是对的；只是示例，本书的计算。</desc>

