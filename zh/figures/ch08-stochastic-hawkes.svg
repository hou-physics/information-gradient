 <desc>一格，两个坐标轴都取对数，纵轴是至少有 l 个事件的级联所占的比例，从 0.0001% 到 100%，横轴是级联规模 l，从 1 到 10,000 个事件，含种子；四条线对应四个分支比 n。四条线都从规模 1 处的 100% 开始下降。n = 1 是临界的情形，画成实线，至少有 10 个事件的约占 26%，100 个的约 8.0%，1,000 个的约 2.5%，10,000 个的约 0.80%。n = 0.95 时 100 个约 4.1%，1,000 个约 0.15%，在约 5,100 个事件处出框；n = 0.8 时 100 个约 0.14%，在约 345 个处出框；n = 0.5 时 10 个约 1.4%，在约 49 个处出框。</desc>
