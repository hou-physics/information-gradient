<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="480" height="492" viewBox="0 0 480 492" font-family="sans-serif">
  <desc>两栏柱子共用一根纵轴，单位是每注的比特数，柱子的高度与数值成比例。左栏是定义一，在同样的价格下比较有信号与没有信号时的增长。左栏第一根柱子是有报告时，高 0.277，下段 0.041，上段 0.236；第二根是没有报告时，只有下段，0.041。第二根柱子旁边的括号标出两者之差，Δ = 0.236。左栏下方写着：给定没有报告的投资者用到的信息，默认是公开可得的信息，这里就是决定价格的人已经看到的东西；在赛马型市场里等于互信息，在一般的股票市场里至多等于互信息。右栏是定义二，持有信念对着价格下注，只有一根有报告时的柱子，高 0.277，上段是信息量 I(θ; Y)，即还没传开的部分，0.236，下段是价格自己的误差 D(π ‖ q)，即还没想明白的部分，0.041。右栏下方写着：给定决定价格的人已经看到的东西；只有价格校准，即 q = π 时，才等于互信息。两栏里 0.236 的各段用同一种颜色，0.041 的各段用另一种颜色，所以左边减去的部分就是右边保留的部分。底部的说明：两栏用同一个条件集，没有报告的投资者用的是决定价格的人已经看到的东西，所以她持有的信念是 0.30；先验概率 0.30，报告有 80% 的时候是对的，价格 0.20，单位是每注的比特数，本书的计算。</desc>

  <rect x="0" y="0" width="480" height="492" fill="#ffffff"/>

  <g fill="#1f1f1f" text-anchor="middle">
    <text x="128" y="22" font-size="13" font-weight="bold">定义一</text>
    <text x="128" y="39" font-size="11">同样的价格下</text>
    <text x="128" y="53" font-size="11">有信号与没有信号相比</text>
    <text x="368" y="22" font-size="13" font-weight="bold">定义二</text>
    <text x="368" y="39" font-size="11">持有信念对着价格下注</text>
  </g>

  <line x1="250" y1="8" x2="250" y2="432" stroke="#d0d0d0" stroke-width="1"/>

  <g stroke="#e4e4e4" stroke-width="1">
    <line x1="44" y1="220" x2="472" y2="220"/>
    <line x1="44" y1="150" x2="472" y2="150"/>
  </g>
  <g stroke="#4a4a4a" stroke-width="1">
    <line x1="44" y1="84" x2="44" y2="290"/>
    <line x1="44" y1="290" x2="472" y2="290"/>
    <line x1="40" y1="290" x2="44" y2="290"/>
    <line x1="40" y1="220" x2="44" y2="220"/>
    <line x1="40" y1="150" x2="44" y2="150"/>
  </g>
  <g fill="#1f1f1f" font-size="10" text-anchor="end">
    <text x="37" y="294">0</text>
    <text x="37" y="224">0.1</text>
    <text x="37" y="154">0.2</text>
  </g>
  <text x="8" y="74" font-size="10" fill="#1f1f1f">每注的比特数</text>

  <g stroke-width="1.5">
    <rect x="66" y="96.1" width="44" height="165.2" fill="#dbe3ee" stroke="#4a5a7a"/>
    <rect x="66" y="261.3" width="44" height="28.7" fill="#f7dcb4" stroke="#9a6a35"/>
    <rect x="134" y="261.3" width="44" height="28.7" fill="#f7dcb4" stroke="#9a6a35"/>
    <rect x="290" y="96.1" width="46" height="165.2" fill="#dbe3ee" stroke="#4a5a7a"/>
    <rect x="290" y="261.3" width="46" height="28.7" fill="#f7dcb4" stroke="#9a6a35"/>
  </g>

  <line x1="110" y1="96.1" x2="182" y2="96.1" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 182 96.1 L 190 96.1 L 190 261.3 L 182 261.3" fill="none" stroke="#4a5a7a" stroke-width="1.5"/>
  <g fill="#1f1f1f" font-size="12">
    <text x="196" y="173"><tspan font-style="italic">Δ</tspan> =</text>
    <text x="196" y="188">0.236</text>
  </g>

  <g fill="#1f1f1f" font-size="10.5" text-anchor="middle">
    <text x="88" y="90">0.277</text>
    <text x="88" y="183">0.236</text>
    <text x="88" y="279.5">0.041</text>
    <text x="156" y="279.5">0.041</text>
    <text x="313" y="90">0.277</text>
    <text x="313" y="183">0.236</text>
    <text x="313" y="279.5">0.041</text>
  </g>

  <g fill="#1f1f1f" font-size="11">
    <text x="344" y="166">信息量</text>
    <text x="344" y="181"><tspan font-style="italic">I</tspan>(<tspan font-style="italic">θ</tspan>; <tspan font-style="italic">Y</tspan>)</text>
    <text x="339" y="195" font-size="10">（还没传开）</text>
    <text x="344" y="254">价格自己的误差</text>
    <text x="344" y="269"><tspan font-style="italic">D</tspan>(<tspan font-style="italic">π</tspan> ‖ <tspan font-style="italic">q</tspan>)</text>
    <text x="339" y="283" font-size="10">（还没想明白）</text>
  </g>

  <g fill="#1f1f1f" font-size="10.5" text-anchor="middle">
    <text x="88" y="311">有报告</text>
    <text x="156" y="311">没有报告</text>
    <text x="313" y="311">有报告</text>
  </g>

  <g fill="#3a3a3a" font-size="10" text-anchor="middle">
    <text x="128" y="342">给定没有报告的投资者用到的信息</text>
    <text x="128" y="355">（默认是公开可得的信息，这里就是</text>
    <text x="128" y="368">决定价格的人已经看到的东西）</text>
    <text x="128" y="400">在赛马型市场里等于互信息；</text>
    <text x="128" y="413">在一般的股票市场里至多等于互信息</text>
    <text x="368" y="342">给定决定价格的人</text>
    <text x="368" y="355">已经看到的东西</text>
    <text x="368" y="400">只有价格校准，即 <tspan font-style="italic">q</tspan> = <tspan font-style="italic">π</tspan><tspan dx="4">时，</tspan></text>
    <text x="368" y="413">才等于互信息</text>
  </g>

  <line x1="8" y1="440" x2="472" y2="440" stroke="#d0d0d0" stroke-width="1"/>
  <g fill="#1f1f1f" font-size="10" text-anchor="middle">
    <text x="240" y="456">两栏用同一个条件集，没有报告的投资者用的是决定价格的人已经看到的东西，</text>
    <text x="240" y="469">所以她持有的信念是 0.30。先验概率 0.30；报告有 80% 的时候是对的；</text>
    <text x="240" y="482">价格 0.20；单位是每注的比特数（本书的计算）。</text>
  </g>
</svg>
